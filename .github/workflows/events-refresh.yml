name: events refresh

# Two jobs in one, both about the same file — src/data/venue-events.json.
#
#   1. Prune shows that have already happened, so the spot sheets never carry a
#      line-up for last Tuesday.
#   2. Shout while there is still time, when the calendar is running out.
#
# The second is the point. A dated calendar does not fail loudly: it just stops
# having anything to say, the "On tonight" section quietly disappears, and
# nobody notices for a month. This turns that silence into an issue in the
# inbox, ten days before it happens.
#
# 12:40 UTC Mondays = 8:40am Washington in summer.
on:
  schedule:
    - cron: '40 12 * * 1'
  workflow_dispatch:
    inputs:
      today:
        description: 'Pretend it is this date (YYYY-MM-DD) — for testing the alarm'
        type: string
        required: false

permissions:
  contents: write     # commit the pruned file
  issues: write       # raise the low-water warning

concurrency:
  group: events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prune past shows and check the horizon
        id: check
        continue-on-error: true      # exit 1 means "a human should look", not "the job broke"
        env:
          TODAY: ${{ inputs.today && format('--today={0}', inputs.today) || '' }}
        run: |
          set -o pipefail
          node scripts/refresh-events.mjs $TODAY | tee /tmp/events.txt

      - name: Commit the pruned calendar
        run: |
          if [[ -n "$(git status --porcelain src/data/venue-events.json)" ]]; then
            git config user.name  "events-refresh"
            git config user.email "actions@github.com"
            git add src/data/venue-events.json
            git commit -m "events: prune past shows $(date -u +%Y-%m-%d) [skip ci]"
            git push
          else
            echo "Nothing to prune."
          fi

      # Only when the script actually asked for a human.
      - name: Warn that the calendar is running out
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create events --color 8E4141 --description "Venue line-up upkeep" 2>/dev/null || true
          # the report reaches GitHub as a file, never interpolated into a command
          gh issue create \
            --title "Venue line-ups need a refresh — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/events.txt \
            --label events

      - name: Calendar is healthy
        if: steps.check.outcome == 'success'
        run: echo "Enough runway left — no issue opened."
